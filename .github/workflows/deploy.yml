name: Siteyi yayınla (GitHub Pages)

# main'e her push'ta Astro sitesi yeniden build edilir, test edilir ve GitHub Pages'e yayınlanır (UPDATE-07, D-141).
# Bakımcılar için: src/content/ altındaki bir YAML dosyasını veya settings.yml'yi GitHub'da düzenleyip commit'leyin —
# gerisi otomatiktir. Testlerden biri başarısız olursa yayın yapılmaz; canlı site olduğu gibi kalır.
# ci.yml aynı adımları pull request'lerde (yayın olmadan) çalıştırır: bir adımı değiştirirseniz ikisini birlikte değiştirin.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek deploy çalışsın.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # Sonuçlar "son güncelleme" = the results PDF's commit time (RESULTS-01)
      - name: Workflow action sürümlerini doğrula
        run: python3 scripts/validate_workflow_actions.py
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Form anahtarını build için hazırla
        env:
          # Bu değer AÇIKTIR — yayınlanan HTML'de görünür, gizli değildir.
          # Repo sırrı olarak tutulmasının tek sebebi commit atmadan
          # değiştirilebilmesidir. Ayrıntı: settings.yml → form_key.
          # FORM_KEY sırrı henüz oluşturulmadıysa eski PORTAL_TOKEN adına
          # düşer; FORM_KEY sırrı oluşturulduktan sonra ikinci kısım silinebilir.
          FORM_KEY: ${{ secrets.FORM_KEY || secrets.PORTAL_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          key = os.environ.get("FORM_KEY", "")
          assert key, "form anahtari tanimsiz (FORM_KEY / PORTAL_TOKEN sırrı yok)"
          p = pathlib.Path("settings.yml")
          s = p.read_text(encoding="utf-8")
          # subn + assert: alan adı değişirse sessizce boş anahtarla yayına
          # çıkmak yerine build BURADA dursun (form aksi halde canlıda bozulur).
          s, _k = re.subn(r'form_key:\s*"[^"]*"', 'form_key: "' + key + '"', s, count=1)
          assert _k == 1, "settings.yml icinde form_key alani bulunamadi"
          p.write_text(s, encoding="utf-8")
          print("hazir form_key=%d karakter" % len(key))
          PY
      - name: Kampanya sözleşmesini doğrula
        run: |
          # Code.gs bu repoda yok (sırlar); yerelde varsa doğrulayıcı onu da karşılaştırır.
          python3 scripts/validate_campaign_contract.py --settings settings.yml
          if [ -f ../Grader/config/campaign.yaml ]; then
            python3 scripts/validate_campaign_contract.py --settings settings.yml \
              --grader ../Grader/config/campaign.yaml
          else
            echo "Grader campaign.yaml yok (ayrı checkout) — Grader eşlemesi atlandı"
          fi
      - name: Tür denetimi, birim testleri, metin ve token denetimi
        run: |
          npx astro check
          npm run test:unit
          npm run lint:copy
          npm run tokens:check
      - name: Siteyi build et
        env:
          # Açık site kimliği (Umami); boşsa analiz betiği eklenmez. Altbilgideki "Son güncelleme" build tarihidir.
          UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
        run: |
          npm run build
          npm run guard:fake
          test -s dist/search/tr.json && test -s dist/search/en.json
      # Browser tests against the site just built (pages, URL parity, Teslim flow and contract, search, axe).
      # Portal and reCAPTCHA are faked by request interception; nothing is sent anywhere.
      - name: Tarayıcı testleri
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
