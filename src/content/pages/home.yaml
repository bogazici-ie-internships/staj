  # The late-submission window on the strip and in the list (maintainer request, D-184).
  lateChip: { tr: "Geç teslim sonu", en: "Late window ends" }
  lateRow: { tr: "Geç teslim süresi", en: "Late-submission window" }
  lateVerdict: { tr: "Her geç gün için 1 iş günü düşülür", en: "1 workday deducted for each late day" }
