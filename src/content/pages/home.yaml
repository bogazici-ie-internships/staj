  cols:
    date: { tr: "Tarih", en: "Date" }
    event: { tr: "Açıklama", en: "Description" }
    status: { tr: "Durum", en: "Status" }
  rows:
    lateClose: { tr: "Geç teslim süresinin sonu", en: "End of late submission" }
    # Board cell; the full sentence is in details.deadline (UPDATE-03 §3).
    latePenalty: { tr: "1 iş günü/gün kesinti", en: "1 workday/day deducted" }
    termEnds: { tr: "{term} · derslerin sonu", en: "{term} · end of classes" }
    termEndsStatus: { tr: "Ertesi gün staj yapılabilir", en: "Internships possible from the next day" }   # FINAL-CHECK F-09
  details:   # shown under the board, always visible (REVIEW-01 Note 3; were popovers, B6)
    # One note for the deadline and the late window (maintainer request, D-184); the late-close row has no note of its own.
    deadline: { tr: "{date}. Bu tarihten sonra {grace} gün süreyle, {closes} tarihine kadar geç teslim kabul edilir. Her geç gün için toplam staj süresinden 1 iş günü düşülür. Son teslimden sonra başlayan her 24 saat 1 geç gün sayılır; birkaç dakika geç kalan bir teslim de 1 gün geç sayılır. Geç teslim süresi bitince online teslim kapanır; sonrasında belgelerinizi zip dosyası olarak, durumunuzu açıklayan bir e-posta ile staj asistanlarına iletebilirsiniz.", en: "{date}. After this date, late submissions are accepted for {grace} days, until {closes}. Each late day deducts 1 workday from the total internship period. Every 24 hours that begin after the deadline count as 1 late day, so a submission even a few minutes late counts as 1 day late. When the late window ends, online submission closes; after that, you may send your documents as a zip file to the internship assistants, with an email explaining your circumstances." }
    termEnds: { tr: "{date}. Derslerin son günüdür; staj ertesi gün başlayabilir.", en: "{date}. Last day of classes; an internship may begin on the following day." }
