process:
  index: { tr: "03 — Süreç", en: "03 — Process" }
  title: { tr: "Staj Süreci", en: "Internship Process" }
  phases:
    - n: "01"
      name: { tr: "Stajdan Önce", en: "Before the Internship" }
      title: { tr: "Belgeler ve Sigorta", en: "Documents and Insurance" }
      anchor: oncesi
      icon: file-pen-line
      items:
        - { tr: "Şirket talep ederse **Staj Zorunluluk Belgesi**'ni şirkete iletiniz.", en: "If the company requests it, provide the **Compulsory Internship Letter**." }
        - { tr: "**Sigorta:** **EK-1**'i doldurup şirkete imzalatınız ve staj koordinatörüne iletiniz: stajdan **en erken 1 hafta, en geç 2 gün önce**. En geç gün iş günü değilse formu bir önceki iş gününe kadar gönderiniz.", en: "**Insurance:** complete the **EK-1**, have the company sign it and send it to the internship coordinator, **no earlier than one week and no later than two days** before the internship begins. If that latest day is not a workday, send the form by the previous workday." }
    - n: "02"
      name: { tr: "Staj Sırasında", en: "During the Internship" }
      title: { tr: "Çizelge ve Notlar", en: "Timetable and Notes" }
      anchor: sirasinda
      icon: calendar-clock
      items:
        - { tr: "Çizelgeyi her iş günü doldurunuz; sonradan toplu doldurmak çok daha zordur.", en: "Fill in the timetable every workday; reconstructing it later is far harder." }
        - { tr: "Yaptığınız işleri EM bakış açısıyla not ediniz; raporun ana bölümü bu notlardan çıkar.", en: "Note your work from an Industrial Engineering perspective; the main section of the report grows out of these notes." }
        - { tr: "Cumartesi çalıştıysanız şirketten imzalı veya kaşeli bir **Cumartesi Yazısı** alınız; bu yazı olmadan o günler sayılmaz.", en: "If you work on Saturdays, get a signed or stamped **Saturday Work Letter** from the company; without it, those days do not count." }
    - n: "03"
      name: { tr: "Stajdan Sonra", en: "After the Internship" }
      title: { tr: "Teslim ve Sonuç", en: "Submission and Results" }
      anchor: sonrasi
      icon: upload
      items:
        - { tr: "**Staj Raporu**, **Staj Sicil Formu**, **Öğrenci Staj Anketi** ve varsa **Cumartesi Yazısı** ile ödeme dekontu veya bordro ve **EK-1**'i son teslim tarihine kadar online olarak yükleyiniz.", en: "Upload the **Internship Report**, the **Trainee Evaluation Form**, the **Student Internship Survey** and, if applicable, the **Saturday Work Letter** and the payment receipt or payslip with the **EK-1** online by the deadline." }
        - { tr: "Sigortanız EK-1 ile başlatıldıysa, şirketten alacağınız tamamlama belgesini {accounting}'ne ({accountingEmail}) iletiniz.", en: "If your insurance was started with the EK-1, submit the completion document from the company to {accounting} ({accountingEmail})." }
        - { tr: "Sonuçlar için duyuruları ve Sonuçlar sayfasını takip ediniz; sonuçlar periyodik olarak ilan edilir.", en: "Follow the announcements and the Results page for your result; results are announced periodically." }
  more: { tr: "Tüm adımlar", en: "All steps" }
