prep:
  eyebrow: { tr: "Teslim · {term}", en: "Submission · {term}" }
  title: { tr: "Belge Teslimi", en: "Document Submission" }
  lead: { tr: "Başlamadan önce tüm belgelerinizi PDF biçiminde hazırlayınız.", en: "Before you begin, prepare all your documents in PDF format." }   # FINAL-CHECK F-04: the duration sentence removed
  deadline: { tr: "Son teslim tarihi", en: "Deadline" }
  lateRule:
    tr: "Bu tarihten sonra **{closes}** tarihine kadar geç teslim kabul edilir. Her geç gün için toplam staj süresinden 1 iş günü düşülür; bu sürenin sonunda online teslim kapanır. Son teslimden sonra başlayan her 24 saat 1 geç gün sayılır; birkaç dakika geç kalan bir teslim de 1 gün geç sayılır. Teslim anı, gönderimin sunucuya ulaştığı andır; büyük dosyalarda gönderim birkaç dakika sürebileceğinden son ana bırakmayınız."
    en: "After this date, late submissions are accepted until **{closes}**. 1 workday is deducted from the total internship period for each late day; online submission closes at the end of this period. Every 24 hours that begin after the deadline count as 1 late day, so a submission even a few minutes late counts as 1 day late. The time of submission is when the submission reaches the server; because large files can take a few minutes to send, do not leave it to the last moment."
  required: { tr: "Tüm Öğrenciler için Zorunlu", en: "Required for All Students" }
  situational: { tr: "Durumunuza Göre Gerekli", en: "Required Depending on Your Situation" }
  # REVIEW-05 Addition (H-01): one submission per internship.
  multiple:
    tr: "Birden fazla staj yaptıysanız (aynı şirkette yapılmış olsalar da) formu her staj için ayrı ayrı gönderiniz. Her gönderime o stajın raporunu, Staj Sicil Formu'nu ve Öğrenci Staj Anketi'ni, varsa o stajın durumuna göre gereken belgelerle birlikte ekleyiniz."
    en: "If you completed more than one internship (even at the same company), submit the form separately for each internship. With each submission, include that internship's report, Trainee Evaluation Form and Student Internship Survey, plus any documents its situation requires."
  limits: { tr: "Dosyaların toplam boyutu {total} MB'tan küçük olmalıdır. @std.bogazici.edu.tr uzantılı e-posta adresinizi kullanınız.", en: "The total file size must be less than {total} MB. Use your email address ending in @std.bogazici.edu.tr." }
  exceptionsTitle: { tr: "Aşağıdaki durumlarda bu form kullanılmamalıdır", en: "This form must not be used in the following cases" }
  exceptions:
    - tr: "Stajınızı ders dönemi içinde (ör. Erasmus veya değişim programı sırasında) yaptıysanız belgelerinizi staj bitiminden itibaren en geç 3 hafta içinde [e-posta ile](page:iletisim) iletiniz ([SSS: Uygunluk ve Zamanlama](page:sss#uygunluk-zamanlama))."
      en: "If you completed your internship during an academic term (e.g. on Erasmus or another exchange programme), send your documents [by email](page:iletisim) within 3 weeks of the end of the internship ([FAQ: Eligibility and Timing](page:sss#uygunluk-zamanlama))."
    - tr: "Mezuniyet için yalnızca stajınız kaldıysa belgelerinizi [genel staj e-posta adresine](page:iletisim) iletiniz."
      en: "If the internship is the only remaining requirement for your graduation, send your documents to the [general internship email address](page:iletisim)."
  ek1Note:
    tr: "Sigortanız EK-1 ile başlatıldıysa bu teslim **yeterli değildir**: şirketten alacağınız tamamlama belgesini ayrıca [{accounting}'ne](page:surec#sonrasi) ([{accountingEmail}](mailto:{accountingEmail})) iletiniz. Bu belgeyi iletmezseniz sigortanız kapanmaz ve başka bir zorunlu staj yapamazsınız."
    en: "If your insurance was started with the EK-1, this submission is **not sufficient**: you must also submit the completion document from the company to [{accounting}](page:surec#sonrasi) ([{accountingEmail}](mailto:{accountingEmail})). If you do not send it, your insurance is not closed and you cannot do another compulsory internship."
