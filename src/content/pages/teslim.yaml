    - { tr: "Başka bir stajınız için teslim yapacaksanız önce bu makbuzu kaydediniz; ardından Belge Teslimi sayfasını yeniden açarak formu o staj için ayrıca gönderiniz.", en: "If you have another internship to submit, first save this receipt; then reopen the Document Submission page and submit the form separately for that internship." }
