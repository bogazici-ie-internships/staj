  discard: { tr: "Vazgeç", en: "Discard" }
  notice: { tr: "Girdiğiniz bilgiler ve seçtiğiniz dosyalar yalnızca bu cihazda (tarayıcınızda) en fazla 24 saat saklanır; teslim tamamlandığında veya Vazgeç seçildiğinde bu süre beklenmeden silinir.", en: "The details you enter and the files you choose are kept only on this device (in your browser) for up to 24 hours; they are deleted as soon as the submission is complete or you choose Discard." }
  discarded: { tr: "Bu cihazdaki kayıt silindi.", en: "The record on this device has been deleted." }
