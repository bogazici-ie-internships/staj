# REVIEW-04 Note 1 (D-137): what the student reads when the server refuses a submission. One text per server
# message (src/lib/submission/contract.ts › SERVER_ERRORS); the server's own wording is never shown for these.
# Placeholders: {doc} the document ("Staj Raporu (rapor.pdf)"), {mb} a size limit, {max} the name length limit,
# {sec} the duplicate-submission interval (DEDUP_SEC = Code.gs CONFIG.DEDUP_SEC).
serverErrors:
  invalid_key:
    tr: "Form anahtarı geçersiz; sayfa güncel olmayabilir. Sayfayı yenileyip yeniden deneyiniz."
    en: "The form key is not valid; the page may be out of date. Refresh the page and try again."
  captcha_failed:
    tr: "Güvenlik doğrulaması başarısız oldu. Sayfayı yenileyip yeniden deneyiniz; VPN kullanıyorsanız kapatarak deneyebilirsiniz."
    en: "The security check failed. Refresh the page and try again; if you are using a VPN, you can try without it."
  invalid_request_id:
    tr: "Gönderim anahtarı geçersiz. Sayfayı yenileyip yeniden deneyiniz."
    en: "The submission key is not valid. Refresh the page and try again."
  closed:
    tr: "Teslim süresi sona erdi; çevrim içi yükleme kapandı. Teslim yapmanız gerekiyorsa belgelerinizi **zip dosyası** olarak, durumunuzu açıklayan bir e-posta ile [staj asistanlarına](page:iletisim) iletiniz."
    en: "The submission period has ended and online uploads are closed. If you still need to submit, email your documents as a **zip file** to the [internship assistants](page:iletisim) with a short explanation."
  required_fields:
    tr: "Ad Soyad, öğrenci numarası ve e-posta adresi zorunludur. Öğrenci Bilgileri adımına dönüp eksik alanları doldurunuz."
    en: "Full name, student ID and email address are required. Go back to the Student Information step and fill in the missing fields."
  name_too_long:
    tr: "Ad Soyad en fazla {max} karakter olabilir. Öğrenci Bilgileri adımında adınızı kısaltınız."
    en: "The full name can be at most {max} characters long. Shorten it in the Student Information step."
  name_invalid:
    tr: "Ad Soyad alanında geçersiz bir karakter var. Öğrenci Bilgileri adımında adınızı yeniden yazınız."
    en: "The full name contains an invalid character. Type it again in the Student Information step."
  email_too_long:
    tr: "E-posta adresi çok uzun. Öğrenci Bilgileri adımında adresinizi kontrol ediniz."
    en: "The email address is too long. Check it in the Student Information step."
  email_invalid:
    tr: "E-posta adresi geçerli değil. Öğrenci Bilgileri adımında adresinizi kontrol ediniz."
    en: "The email address is not valid. Check it in the Student Information step."
  email_domain:
    tr: "**@std.bogazici.edu.tr** uzantılı öğrenci e-posta adresinizi kullanınız. Öğrenci Bilgileri adımında adresinizi değiştiriniz."
    en: "Use your student email address ending in **@std.bogazici.edu.tr**. Change it in the Student Information step."
  sid_format:
    tr: "Öğrenci numarası 20 ile başlayan 10 haneli bir sayı olmalıdır. Öğrenci Bilgileri adımında numaranızı kontrol ediniz."
    en: "The student ID must be a 10-digit number beginning with 20. Check it in the Student Information step."
  rate_limited:
    tr: "Bu e-posta adresiyle birkaç saniye önce bir gönderim başlatıldı. Önceki gönderiminizin üzerinden en az {sec} saniye geçmeden yeni gönderim yapılamaz. Süre dolunca bilgilerinizi değiştirmeden **Tekrar dene** düğmesine basınız; önceki gönderim bu sayfadan yapıldıysa ve tamamlandıysa makbuzunuz gösterilir, ikinci bir kayıt oluşmaz.\n\nAynı staj için belgeleri başka bir sekmeden veya cihazdan zaten gönderdiyseniz formu yeniden göndermeyiniz; eksik veya hatalı bir belge varsa onu, o gönderimin referans numarasını belirterek e-posta ile [staj asistanlarına](page:iletisim) iletiniz."
    en: "A submission was started with this email address a few seconds ago. A new submission cannot be made until at least {sec} seconds have passed since your previous one. When the time is up, select **Try again** without changing your details; if the previous submission was made from this page and has completed, your receipt is shown and no second record is created.\n\nIf you have already sent the documents for the same internship from another tab or device, do not submit the form again; if a document is missing or incorrect, email it to the [internship assistants](page:iletisim) and quote that submission's reference number."
  bad_package:
    tr: "Belgeler sunucuya eksiksiz ulaşmadı. Yeniden deneyiniz; sorun sürerse [staj asistanlarına](page:iletisim) başvurunuz."
    en: "The documents did not reach the server complete. Try again; if the problem continues, contact the [internship assistants](page:iletisim)."
  unknown_field:
    tr: "Gönderimde tanınmayan bir belge alanı var. Sayfayı yenileyip yeniden deneyiniz."
    en: "The submission contains an unrecognised document field. Refresh the page and try again."
  missing_doc:
    tr: "Zorunlu bir belge eksik: {doc}. Belgeler adımında bu belgeyi ekleyiniz."
    en: "A required document is missing: {doc}. Add it in the Documents step."
  missing_cumartesi:
    tr: "Cumartesi çalıştığınızı belirttiniz; bu durumda **Cumartesi Yazısı** zorunludur. Belgeler adımında ekleyiniz."
    en: "You indicated Saturday work, so the **Saturday Work Letter** is required. Add it in the Documents step."
  missing_dekont:
    tr: "Devlet katkısı için **Ödeme Dekontu veya Bordro** zorunludur. Belgeler adımında ekleyiniz."
    en: "A **Payment Receipt or Payslip** is required for the government contribution. Add it in the Documents step."
  missing_ek1:
    tr: "Devlet katkısı için staj başında kullanılan **EK-1** zorunludur. Belgeler adımında ekleyiniz."
    en: "The **EK-1** used at the start of the internship is required for the government contribution. Add it in the Documents step."
  bad_content:
    tr: "{doc} dosyasının içeriği okunamadı. Dosyayı yeniden PDF olarak kaydedip Belgeler adımında yeniden seçiniz."
    en: "The content of {doc} could not be read. Save the file as a PDF again and select it again in the Documents step."
  total_size:
    tr: "Dosyaların toplam boyutu {mb} MB sınırını aşıyor. Belgeler adımında dosyalarınızı küçültüp yeniden seçiniz."
    en: "The combined file size exceeds the {mb} MB limit. Make your files smaller and select them again in the Documents step."
  too_large:
    tr: "{doc} en fazla {mb} MB olabilir. Dosyayı küçültüp Belgeler adımında yeniden seçiniz."
    en: "{doc} can be at most {mb} MB. Make the file smaller and select it again in the Documents step."
  not_pdf:
    tr: "{doc} geçerli bir PDF dosyası değil. Dosyayı PDF olarak kaydedip Belgeler adımında yeniden seçiniz."
    en: "{doc} is not a valid PDF file. Save it as a PDF and select it again in the Documents step."
  busy:
    tr: "Teslim sunucusu önceki bir isteği tamamlıyor. Birkaç saniye bekleyip bilgilerinizi değiştirmeden **Tekrar dene** düğmesine basınız."
    en: "The submission server is finishing a previous request. Wait a few seconds, then select **Try again** without changing your details."
  in_progress:
    tr: "Bu gönderim hâlâ işleniyor. Birkaç saniye bekleyip bilgilerinizi değiştirmeden **Tekrar dene** düğmesine basınız; gönderim tamamlandıysa makbuzunuz gösterilir."
    en: "This submission is still being processed. Wait a few seconds, then select **Try again** without changing your details; if it has completed, your receipt is shown."
  rollback:
    tr: "Gönderim tamamlanamadı; oluşturulan geçici dosya geri alındı ve kayıt yapılmadı. Yeniden deneyiniz. Sorun sürerse bu ekranın görüntüsünü [staj asistanlarına](page:iletisim) e-posta ile iletiniz."
    en: "The submission could not be completed; the temporary file was removed and nothing was recorded. Try again. If the problem continues, email a screenshot of this screen to the [internship assistants](page:iletisim)."
  contract_mismatch:
    tr: "Teslim dönemi bilgileri sunucuyla uyuşmuyor. Sayfayı yenileyiniz; sorun sürerse [staj asistanlarına](page:iletisim) başvurunuz."
    en: "The submission-term details do not match the server. Refresh the page; if the problem continues, contact the [internship assistants](page:iletisim)."
  server_error:
    tr: "Sunucuda beklenmeyen bir hata oluştu. Yeniden deneyiniz; sorun sürerse [staj asistanlarına](page:iletisim) başvurunuz."
    en: "An unexpected error occurred on the server. Try again; if the problem continues, contact the [internship assistants](page:iletisim)."
help:
  title: { tr: "Teslimde Sorun Yaşarsanız", en: "If You Have Problems Submitting" }
  items:
    - { tr: "Tüm belgeler **PDF** biçiminde olmalıdır. Her belgenin boyut sınırı kendi alanında yazar; toplam boyut **45 MB'tan küçük** olmalıdır.", en: "All documents must be in **PDF** format. Each document's size limit is shown in its field; the total must be **less than 45 MB**." }
    - { tr: "**@std.bogazici.edu.tr** uzantılı öğrenci e-posta adresinizi kullanınız.", en: "Use your student email address ending in **@std.bogazici.edu.tr**." }
    - { tr: "Bağlantı hatası durumunda girdiğiniz bilgiler ve seçtiğiniz dosyalar sayfada korunur. Önce bağlantınızı kontrol ederek **Tekrar dene** düğmesine basınız. Sayfa yenilense bile bilgileriniz ve dosyalarınız bu cihazda 24 saat saklanır ve kaldığınız yerden devam edebilirsiniz.", en: "If a connection error occurs, your details and selected files remain on the page. First check your connection and select **Try again**. Even if the page is refreshed, your details and files are kept on this device for 24 hours, and you can continue where you left off." }
    - tr: "Sorun devam ederse belgelerinizi **son teslim tarihinden önce** e-posta ile [staj asistanlarına](page:iletisim) iletiniz."
      en: "If the problem persists, email your documents to the [internship assistants](page:iletisim) **before the deadline**."
      # RELEASE-CHECK R-08 (D-181): shown instead during the late window, when the deadline has already passed.
      late: { tr: "Sorun devam ederse belgelerinizi **geç teslim süresi sona ermeden önce** e-posta ile [staj asistanlarına](page:iletisim) iletiniz. Geç teslim süresi {closes} tarihinde sona erer.", en: "If the problem persists, email your documents to the [internship assistants](page:iletisim) **before the late-submission window closes**. The late-submission window closes on {closes}." }
noscript: { tr: "Teslim formu, tarayıcınızda **JavaScript etkin olduğunda** çalışır. JavaScript'i etkinleştiremiyorsanız belgelerinizi son teslim tarihinden veya geç teslim süresinin sonundan önce e-posta ile [staj asistanlarına](page:iletisim) iletiniz.", en: "The submission form requires **JavaScript to be enabled** in your browser. If you cannot enable it, email your documents to the [internship assistants](page:iletisim) before the deadline or before the end of the late-submission window." }
