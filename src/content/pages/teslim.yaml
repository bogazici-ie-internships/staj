# Teslim kurtarma (UPDATE-06 Phase 2b): the flow is kept on this device until it is submitted or discarded.
recovery:
  found: { tr: "Bu cihazda yarım kalmış bir teslim bulundu ({date} tarihinde kaydedildi). Kaldığınız yerden devam edebilir veya kaydı silebilirsiniz.", en: "An unfinished submission was found on this device (saved on {date}). You can continue where you left off or delete it." }
