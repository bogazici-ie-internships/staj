# "Site Hakkında" block at the end of the İletişim page (UPDATE-04 §1). {name} and {role} are filled in below.
about:
  anchor: { tr: "site-hakkinda", en: "about-this-site" }
  title: { tr: "Site Hakkında", en: "About This Site" }
  maintainer:
    name: Berat Kubilay Güngez
    role: { tr: "staj asistanı", en: "internship assistant" }
  text:
    tr: "Bu site, Boğaziçi Üniversitesi Endüstri Mühendisliği Bölümü {role} {name} tarafından hazırlanır ve güncellenir. Siteyle ilgili teknik sorunları staj asistanlarına e-postayla bildirebilirsiniz."
    en: "This website was created and is maintained by {name}, {role} at the Department of Industrial Engineering, Boğaziçi University. Please report technical problems with the site to the internship assistants by email."
# University units named in the copy. ONE place for the name (UPDATE-04 §2): other files write
# {accounting} / {accountingEmail}, filled in by src/lib/content.ts. The TR suffix in those files
# ("{accounting}'ne") assumes a name ending in -i (İşleri, Birimi). Name as on the live site and
# the maintainer's decision (UPDATE-05 §1, D-71).
units:
  accounting:
    name: { tr: "Hesap İşleri", en: "Accounting Affairs" }   # address: settings.yml iletisim.hesap_isleri_eposta (D-78)
