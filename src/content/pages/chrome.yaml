# Site chrome: names, navigation, per-page <title> / meta description, footer and 404 copy.
# <title>s follow the page headings (UPDATE-04 §6; URLs unchanged); descriptions follow the UPDATE-03 voice.
# Every title/description that differs from the MkDocs site is listed in tests/e2e/parity.spec.ts.
brand:
  service: { tr: "Zorunlu Staj", en: "Compulsory Internship" }
  institution: { tr: "Boğaziçi Üniversitesi · Endüstri Mühendisliği", en: "Boğaziçi University · Industrial Engineering" }
  titleSuffix: { tr: "Zorunlu Staj Kılavuzu", en: "Compulsory Internship Guide" }
  seal: { tr: "Boğaziçi Üniversitesi mührü", en: "Boğaziçi University seal" }
  ogAlt: { tr: "Boğaziçi Üniversitesi Endüstri Mühendisliği — Zorunlu Staj Kılavuzu", en: "Boğaziçi University Industrial Engineering — Compulsory Internship Guide" }
  ogTitle: { tr: "Boğaziçi Üniversitesi Endüstri Mühendisliği · Zorunlu Staj Kılavuzu", en: "Boğaziçi University Industrial Engineering · Compulsory Internship Guide" }
  siteName: { tr: "Boğaziçi Üniversitesi — Endüstri Mühendisliği Zorunlu Staj", en: "Boğaziçi University — Industrial Engineering Compulsory Internship" }
# Order = header order. `short` is the nav label, `title` the page title.
pages:
  - { key: home, path: "", title: { tr: Ana Sayfa, en: Home }, short: { tr: Ana sayfa, en: Home },
      head: { tr: "Zorunlu Staj Kılavuzu · Boğaziçi Üniversitesi Endüstri Mühendisliği", en: "Compulsory Internship Guide · Boğaziçi University Industrial Engineering" },
      description: { tr: "Boğaziçi Üniversitesi Endüstri Mühendisliği zorunlu staj kılavuzu: staj tarihleri, sigorta (EK-1), rapor hazırlama, belge teslimi ve sık sorulan sorular.", en: "Boğaziçi University Industrial Engineering compulsory internship guide: dates, insurance (EK-1), report preparation, document submission and frequently asked questions." } }
  - { key: surec, path: surec/, title: { tr: Staj Süreci, en: Internship Process }, short: { tr: Süreç, en: Process },
      description: { tr: "Stajdan önce, staj sırasında ve stajdan sonra yapılması gerekenler: EK-1 ve sigorta, çizelge, Cumartesi Yazısı ve belge teslimi.", en: "Steps before, during and after the internship: the EK-1 and insurance, the timetable, the Saturday Work Letter and document submission." } }
  - { key: kurallar, path: kurallar/, title: { tr: Kurallar, en: Rules }, short: { tr: Kurallar, en: Rules },
      description: { tr: "Zorunlu staj kuralları: 40 iş günü ve en az 15 iş günü üretim stajı şartı, staj kuralları, rapor ve teslim kuralları ile rapor konu rehberi.", en: "Compulsory internship rules: the 40-workday requirement and at least 15 workdays of Production Internship, internship rules, report and submission rules, and the topic guide." } }
  - { key: rapor, path: rapor/, title: { tr: Rapor Hazırlama, en: Report Preparation }, short: { tr: Rapor, en: Report },
      description: { tr: "Staj raporu nasıl hazırlanır: rapor şablonunun sekiz zorunlu bölümü, duruma göre eklenen Appendices ve References bölümleri ve her bölümde neyin yazılacağı.", en: "How to prepare the internship report: the eight required sections of the report template, the Appendices and References sections added when needed, and what each section should cover." } }
  - { key: formlar, path: formlar/, title: { tr: "Formlar ve Belgeler", en: "Forms and Documents" }, short: { tr: "Belgeler", en: "Documents" },
      description: { tr: "Zorunlu staj formları ve belgeleri: Staj Zorunluluk Belgesi, EK-1, Staj Sicil Formu, Öğrenci Staj Anketi ve çizelge şablonu.", en: "Compulsory internship forms and documents: the Compulsory Internship Letter, EK-1, Trainee Evaluation Form, Student Internship Survey and timetable template." } }
  - { key: sss, path: sss/, title: { tr: Sık Sorulan Sorular, en: Frequently Asked Questions }, short: { tr: SSS, en: FAQ },
      description: { tr: "Zorunlu staj hakkında sık sorulan sorular: uygunluk ve zamanlama, süre ve gün sayımı, staj türü, belgeler, teslim ve sonuç.", en: "Frequently asked questions about the compulsory internship: eligibility and timing, duration and day counting, internship type, documents, submission and results." } }
  - { key: sonuclar, path: sonuclar/, title: { tr: Sonuçlar, en: Results }, short: { tr: Sonuçlar, en: Results },
      description: { tr: "Zorunlu staj değerlendirme sonuçlarının ilan edildiği sayfa ve sonuç klasörüne erişim.", en: "Where compulsory internship evaluation results are announced, with access to the results folder." } }
  - { key: iletisim, path: iletisim/, title: { tr: İletişim, en: Contact }, short: { tr: İletişim, en: Contact },
      description: { tr: "Staj asistanları ve staj koordinatörünün iletişim bilgileri ile hangi konularda kime başvurulacağı.", en: "Contact details for the internship assistants and the internship coordinator, and whom to contact about which matters." } }
  - { key: teslim, path: teslim/, title: { tr: Belge Teslimi, en: Document Submission }, short: { tr: Belgeleri gönder, en: Submit documents },
      description: { tr: "Staj raporu ve belgelerin online teslimi: son teslim tarihi ve saati, geç teslim kuralı, yükleme formu ve teslimde sorun yaşanması durumunda izlenecek yol.", en: "Online submission of the internship report and documents: the deadline and time, the late-submission rule, the upload form and what to do if the submission fails." } }
