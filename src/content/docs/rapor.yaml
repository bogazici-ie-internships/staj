lead:
  - kind: p
    text:
      tr: Staj raporu **İngilizce** yazılır ve **ekler hariç en fazla 20 sayfadır**. Rapor aşağıdaki şablona uyar; kuralların tam metni için **[Internship Handbook](doc:Revised-Handbook-of-Internship.pdf)**'a bakınız.
      en: The internship report is written in **English**, is at most **20 pages excluding appendices** and follows the outline below. The full rules are in the **[Internship Handbook](doc:Revised-Handbook-of-Internship.pdf)**.
    src: rapor.md:8 · rapor.en.md:8
  - kind: callout
    tone: summary
    title:
      tr: Bir Bakışta
      en: At a Glance
    src: rapor.md:12 · rapor.en.md:13
    blocks:
      - kind: list
        items:
          - text:
              tr: Rapor **İngilizce** yazılır; alt sorular soru-cevap biçiminde değil, **akıcı paragraflar** hâlinde ele alınır.
              en: The report is written in **English**; the prompts are addressed in **coherent paragraphs**, not in a question-and-answer format.
            src: rapor.md:13 · rapor.en.md:14
          - text:
              tr: "Rapor **ekler hariç en fazla 20 sayfa** olmalıdır."
              en: The report must not exceed **20 pages excluding appendices**.
            src: rapor.md:14 · rapor.en.md:16
          - text:
              tr: "Rapor **8 zorunlu bölümden** oluşur: Cover Page, Executive Summary, Table of Contents, Timetable, Company/Organization Introduction, ana bölüm olan Internship Activities, Assessment ve Conclusions."
              en: "The report has **8 required sections**: Cover Page, Executive Summary, Table of Contents, Timetable, Company/Organization Introduction, Internship Activities (the main body), Assessment and Conclusions."
            src: rapor.md:15 · rapor.en.md:17
          - text:
              tr: "**Appendices** ve **References** duruma göre eklenir: yalnızca ek materyal veya kaynak kullandıysanız gereklidir ve 20 sayfa sınırına sayılmaz."
              en: "**Appendices** and **References** are added when needed: they are required only if you use supplementary material or outside sources, and they do not count towards the 20-page limit."
            src: rapor.md:16 · rapor.en.md:20
          - text:
              tr: Raporun ana bölümü olan **Internship Activities**, **EM bakış açısıyla** yazılır; [Konu Rehberi](page:kurallar#konu-rehberi)'nden yararlanabilirsiniz.
              en: "**Internship Activities**, the main body, must be written from an **industrial engineering perspective**; you may use the [Topic Guide](page:kurallar#konu-rehberi)."
            src: rapor.md:17 · rapor.en.md:23
          - text:
              tr: "Zorunlu bir bölüm eksikse, 20 sayfa sınırı aşılırsa veya bölümler soru-cevap biçiminde yazılırsa değerlendirmede kabul edilen staj gününden kesinti yapılabilir."
              en: "Missing required sections, exceeding the 20-page limit or writing sections in a question-and-answer format may lead to a deduction from the accepted internship days."
            src: new — report format rule (missing sections, page limit, question-and-answer format)
          - text:
              tr: "Her staj için ayrı bir rapor hazırlanır; aynı şirkette yapılan farklı stajlar da ayrı raporlarla teslim edilir."
              en: "A separate report must be prepared for each internship; different internships completed at the same company are also submitted with separate reports."
            src: new — REVIEW-05 Addition (H-01), one report per internship
