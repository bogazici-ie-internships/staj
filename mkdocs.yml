site_name: Boğaziçi Üniversitesi — Endüstri Mühendisliği Zorunlu Staj
site_description: >-
  Boğaziçi Üniversitesi Endüstri Mühendisliği Bölümü zorunlu staj süreci:
  adım adım rehber, formlar, kurallar, rapor hazırlama ve sık sorulan sorular.
site_author: Boğaziçi Üniversitesi Endüstri Mühendisliği Bölümü

# Yayın adresi (mutlak linkler / SEO / sitemap için). Özel alan adı bağlarsan değiştir.
site_url: https://bogazici-ie-internships.github.io/staj/

# Footer alt barında gösterilir. "Son güncelleme" tarihi her deploy'da deploy.yml tarafından otomatik güncellenir.
copyright: "Boğaziçi Üniversitesi — Endüstri Mühendisliği<br>Hazırlayan: Berat Kubilay Güngez · Son güncelleme: 21 Haziran 2026"

theme:
  name: material
  custom_dir: overrides     # overrides/main.html → sekme (tab) başlığı için kısa marka
  language: tr
  logo: assets/bulogo.svg             # ORİJİNAL tam renkli BÜ mührü (boyanmaz); header'da beyaz zemin üzerinde gösterilir
  favicon: assets/bulogo.svg          # tarayıcı sekmesi (aynı tam renkli mühür)
  palette:
    # Açık mod — işletim sistemi açık tema istediğinde (veya tercih belirtmediğinde).
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Koyu moda geç
    # Koyu mod — işletim sistemi koyu tema istediğinde otomatik seçilir.
    # media olmadan bu satır hiç devreye girmiyordu: koyu tema kullanan
    # ziyaretçiler siteyi her cihazda elle karanlığa almak zorunda kalıyordu.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Açık moda geç
  # PERF: Google Fonts dış isteği kapatıldı. Inter + Newsreader self-host (extra.css
  # @font-face), kod fontu sistem-mono. Render-blocking dış istek kalmadı.
  font: false
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tooltips

# Build sırasında kırık linkleri/anchor'ları yakala (CI'da --strict ile hataya döner).
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

plugins:
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: tr
          name: TR
          build: true
          default: true
        - locale: en
          name: EN
          build: true
          site_name: Boğaziçi University — Industrial Engineering Compulsory Internship
          site_description: >-
            A step-by-step guide to the compulsory internship process for
            Boğaziçi University Industrial Engineering students, including
            forms, rules, report preparation, and frequently asked questions.
          site_author: Boğaziçi University Department of Industrial Engineering
          nav_translations:
            Ana Sayfa: Home
            Staj Süreci: Internship Process
            Kurallar: Rules
            Rapor Hazırlama: Report Preparation
            Formlar & Belgeler: Forms & Documents
            Teslim: Submission
            Sık Sorulan Sorular: Frequently Asked Questions
            Sonuçlar: Results
            İletişim: Contact
  - search:
      lang: tr
  # Düzenli değişen TÜM değerleri (dönem, tarihler, iletişim, bağlantılar) dış
  # config dosyasından okur: docs içinde {{ donem.etiket }}, {{ iletisim.* }} vb.
  # Tek kaynak → settings.yml
  - macros:
      include_yaml:
        - settings.yml

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: false      # başlık yanındaki ¶ kalıcı bağlantı simgesi kapalı (site geneli)
      title: Bu sayfada
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  # Stil değişince ?v sayısını artır → öğrenci tarayıcısındaki eski CSS cache'i hemen kırılır.
  - assets/extra.css?v=103

extra_javascript:
  # JS değişince ?v sayısını artır → eski cache hemen kırılır.
  - assets/yearbar.js?v=3
  # Teslim formunun TÜM mantığı (TR + EN tek kaynak). Teslim sayfası dışında
  # #sufForm bulunmadığı için erkenden çıkar; sayfaya özgü değerler formun
  # data-* öznitelikleriyle gelir.
  - assets/submit.js?v=2
  # reveal.js KALDIRILDI (PERF): ana sayfa scroll-reveal animasyonları jank
  # üretiyordu; içerik artık anında ve tam görünür.

extra:
  generator: false          # alttaki "Made with Material for MkDocs" yazısını kaldırır
  bolum_sitesi: "https://ie.bogazici.edu.tr/"   # Boğaziçi EM Bölümü resmi sitesi (footer linki)
  social:
    - icon: fontawesome/solid/envelope
      link: mailto:ie.boun.internships@gmail.com
      name: Staj asistanları — genel iletişim

nav:
  - Ana Sayfa: index.md
  - Staj Süreci: surec/index.md
  - Kurallar: kurallar.md
  - Rapor Hazırlama: rapor.md
  - Formlar & Belgeler: formlar.md
  - Teslim: teslim.md
  - Sık Sorulan Sorular: sss.md
  - Sonuçlar: sonuclar.md
  - İletişim: iletisim.md
