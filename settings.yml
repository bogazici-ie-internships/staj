# ============================================================================
#  SITE SETTINGS — contact, links, and calendar content are here.
#  The campaign fields under donem must match Code.gs (CONFIG) and
#  Grader/config/campaign.yaml exactly; validate_campaign_contract.py checks the first
#  pair. See _maintainer/DEPLOYMENT.md for the safe deployment order.
# ============================================================================

# --- Generated current term & dates ------------------------------------
# SINGLE submission term. The portal accepts only one campaign at a time; the Submission
# page has NO term selection. The 9 fields below must match Code.gs -> CONFIG
# exactly:
#   python3 scripts/validate_campaign_contract.py --settings settings.yml --code _maintainer/Code.gs
donem:
  # Contract identifier that remains unchanged across portal → evaluation → database.
  contract_version: 1
  campaign_id: "2026-summer"
  etiket: "2026 Yaz" # current term (visible on the site)
  etiket_en: "Summer 2026"
  year_done: 2026
  semester: "Summer"
  staj_baslangic: "2026-06-16"
  staj_bitis: "2026-09-12"

  # FINAL DEADLINE (on-time) — date + TIME (+03:00). Format: "YYYY-MM-DD HH:MM"
  # The form does NOT close after this date; it stays open as a
  # "late submission" for as many additional days as gec_teslim_gun below (warning + penalty). Empty ("") = lock disabled.
  teslim_kilit: "2026-10-12 10:00"

  # LATE SUBMISSION WINDOW — how many additional DAYS uploads are accepted after the final deadline.
  # Every 24 hours that begins counts as 1 late day; each late day
  # deducts 1 business day from the internship duration. Online upload closes at the end of this period. 0 = no late submission.
  gec_teslim_gun: 10

